[package]
name = "pf-chat"
description = "Pocket Forge prompt chat backend (#58, #60): Claude Code headless adapter pieces and the slice-0 probe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The dev-only probe that runs the real Claude Code CLI (PRM slice 0). Never set in CI
# (scripts/check-hygiene.sh refuses `real-call` in workflows; the probe refuses to run under CI).
real-call = ["dep:image"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Probe only: the overlay test image (JPEG q85, FR-PRM-25). Approved workspace dependency.
image = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# R75: Job Object only (chat children end with the job, §10).
windows-sys.workspace = true

# R75: the workspace lints, except `unsafe_code` is `deny` (not `forbid`) so the one Job
# Object module (`src/job.rs`) can allow it, with a SAFETY comment per block.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[[bin]]
name = "pf-chat-probe"
path = "src/bin/pf-chat-probe/main.rs"
required-features = ["real-call"]

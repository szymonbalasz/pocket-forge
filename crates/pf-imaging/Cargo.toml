[package]
name = "pf-imaging"
description = "Pocket Forge image operations (ADR 0004): decode, probe, tile pyramid, region extract, blend, flatten, encode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fast_image_resize.workspace = true
image.workspace = true
jpeg-encoder.workspace = true
libwebp-sys.workspace = true
png.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The workspace lints, except `unsafe_code` is `deny` instead of `forbid`: the libwebp FFI module
# (src/webp.rs) is the one place that allows it (ADR 0004, `libwebp-sys`). Keep the rest in sync
# with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

name: CI

on:
  # Every branch push runs CI: branches are merged locally once green (#28).
  push:
    branches: ['**']
  # PRs from forks only (same-repo branches are already covered by push).
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Fail fast if a real provider call is ever attempted (AGENTS §3.7).
  PF_PROVIDER: fake

# Jobs run in parallel; keep them balanced (AGENTS §5). Rebalance when one runs > 2× the median.
jobs:
  hygiene:
    name: Hygiene (public repo, rustfmt, crate direction)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-hygiene.sh
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: node scripts/check-crate-deps.mjs

  rust:
    name: Rust ${{ matrix.crate }} (clippy + tests)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [pf-core, pf-imaging, pf-provider]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets --locked -- -D warnings
      - run: cargo test -p ${{ matrix.crate }} --locked

  ui:
    name: UI (tsc, ESLint, Prettier, Vitest)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
        working-directory: app
      - run: pnpm exec eslint --max-warnings 0 .
        working-directory: app
      - run: pnpm exec prettier --check .
        working-directory: app
      - run: pnpm exec vitest run
        working-directory: app

  e2e:
    name: E2E (Playwright, mocked core)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      # One retry (playwright.config.ts); a pass on retry is reported as flaky below.
      - run: pnpm exec playwright test
        working-directory: app
      - name: Report flaky tests
        if: always()
        run: node scripts/report-flaky.mjs app/test-results/results.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  windows:
    name: Windows (app clippy + tests, Tauri build + smoke)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend build (tauri::generate_context! embeds it)
        run: pnpm exec vite build
        working-directory: app
      - run: cargo clippy -p pocket-forge --all-targets --locked -- -D warnings
      - run: cargo test -p pocket-forge --locked
      - name: Tauri build (debug, no installer)
        run: pnpm exec tauri build --debug --no-bundle
        working-directory: app
      - name: Smoke (launch, UI reaches the core, exit)
        run: node scripts/tauri-smoke.mjs --no-build

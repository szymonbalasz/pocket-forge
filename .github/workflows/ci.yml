name: CI

on:
  # Every branch push runs CI: branches are merged locally once green (#28).
  push:
    branches: ['**']
  # PRs from forks only (same-repo branches are already covered by push).
  pull_request:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # On main every commit gets its own group and is never cancelled: a later docs-only push
  # would otherwise skip the tests a cancelled or replaced run owed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Fail fast if a real provider call is ever attempted (AGENTS §3.7).
  PF_PROVIDER: fake

# Jobs run in parallel; keep them balanced (AGENTS §5). Rebalance when one runs > 2× the median.
jobs:
  # Docs-only pushes skip the build and test jobs (hygiene always runs).
  changes:
    name: Changes (docs-only?)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" = "main" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$'; then
            base="$BEFORE"
          else
            base=$(git merge-base origin/main HEAD)
          fi
          files=$(git diff --name-only "$base" HEAD || echo "unknown")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  hygiene:
    name: Hygiene (public repo, rustfmt, crate direction)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-hygiene.sh
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: node scripts/check-crate-deps.mjs

  rust:
    name: Rust ${{ matrix.crate }} (clippy + tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [pf-core, pf-imaging, pf-provider, pf-chat]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets --locked -- -D warnings
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets --release --locked -- -D warnings
      - run: cargo test -p ${{ matrix.crate }} --locked

  ui:
    name: UI (tsc, ESLint, Prettier, Vitest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
        working-directory: app
      - run: pnpm exec eslint --max-warnings 0 .
        working-directory: app
      - run: pnpm exec prettier --check .
        working-directory: app
      - run: pnpm exec vitest run
        working-directory: app

  e2e:
    name: E2E (Playwright, mocked core)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      # One retry (playwright.config.ts); a pass on retry is reported as flaky below.
      - run: pnpm exec playwright test
        working-directory: app
      - name: Report flaky tests
        if: always()
        run: node scripts/report-flaky.mjs app/test-results/results.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # The app crate needs WebView2/Tauri, so it is linted and built on Windows. Split in two
  # parallel jobs: clippy (check artifacts) and test + build + smoke (full artifacts) share nothing.
  windows-clippy:
    name: Windows app clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend build (tauri::generate_context! embeds it)
        run: pnpm exec vite build
        working-directory: app
      - run: cargo clippy -p pocket-forge --all-targets --locked -- -D warnings

  windows:
    name: Windows app tests, Tauri build + smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tauri build (debug, no installer; builds the frontend first)
        run: pnpm exec tauri build --debug --no-bundle
        working-directory: app
      - name: Smoke (launch, UI reaches the core, exit)
        run: node scripts/tauri-smoke.mjs --no-build
      - run: cargo test -p pocket-forge --locked
      - name: pf-provider OS credential store test (Windows only, FR-PRV-06)
        run: cargo test -p pf-provider --locked fr_prv_06
      - name: pf-chat tests on Windows (Job Object, process tree; R89)
        run: cargo test -p pf-chat --locked

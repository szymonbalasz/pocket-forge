name: CI

on:
  # Every branch push runs CI: branches are merged locally once green (#28).
  push:
    branches: ['**']
  # PRs from forks only (same-repo branches are already covered by push).
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Public-repo hygiene
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-hygiene.sh

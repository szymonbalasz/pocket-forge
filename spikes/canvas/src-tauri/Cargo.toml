[package]
name = "canvas-spike"
version = "0.0.0"
edition = "2021"
# Resolve deps that build on the installed toolchain (no global rustup changes on spike branches).
rust-version = "1.86"
publish = false

[lib]
name = "canvas_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Keep the throwaway build light.
[profile.dev]
debug = 0

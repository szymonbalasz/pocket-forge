[package]
name = "pf-imaging-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
publish = false
description = "Throwaway benchmark for the Pocket Forge large-image spike. Not production code."
license = "MIT"

# Standalone crate: not a member of any workspace.
[workspace]

[dependencies]
color_quant = "1"
fast_image_resize = { version = "5.1.4", features = ["rayon"] }
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "rayon"] }
image-webp = "0.2.4"
jpeg-encoder = "0.6.1"
libwebp-sys = "0.14"
png = "0.18.1"
rayon = "1.12.0"
tiny-skia = "0.12.0"
zune-jpeg = "0.4"

[profile.release]
debug = false
codegen-units = 16
lto = false

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
